<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Journal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>My Music Journal 🎵</h1>
  </header>

  <main>
    <section id="entry-form">
      <h2>Add a New Entry</h2>
      <div>
        <input id="searchInput" placeholder="Search for a song or album">

      </div>

      <div id="results"></div>

     <h2>Selected Song</h2>
        <div id="selected-song"></div>

<h2>Your Journal</h2>
<div id="journal"></div>
        </section>


  </main>

  <script src="script.js"></script>
</body>
</html>
